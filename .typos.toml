# Configuration for crate-ci/typos
# https://github.com/crate-ci/typos
[files]
extend-exclude = [
  "package-lock.json",
  "dist/",
  "node_modules/",
  ".husky/_/",
  "*.snap",
]

[default]
extend-ignore-re = [
  # Hex strings (likely ObjectId examples, hashes)
  "[0-9a-fA-F]{24,}",
  # ObjectId literal references
  "ObjectId",
  # GUIDs
  "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
]

[default.extend-words]
# Framework
loopback = "loopback"
# Query operators
nin = "nin"
# Contracts-specific
ajv = "ajv"
ejs = "ejs"
proto = "proto"
avro = "avro"
asyncapi = "asyncapi"
cloudevents = "cloudevents"
quicktype = "quicktype"
zod = "zod"
jsonschema = "jsonschema"
openapi = "openapi"
chokidar = "chokidar"
jsonc = "jsonc"
# Valid spelling variant used in error messages and tests
unparseable = "unparseable"
# Package name (cpy-cli) mentioned in a comment
cpy = "cpy"
# Deliberate misspelling used as an example of a caught config typo
securtiy = "securtiy"
